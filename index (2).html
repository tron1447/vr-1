function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function tone(freq, dur = .15, delay = 0, type = 'sine', vol = .25){
  const a = audio(), t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
}

function roundRect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function wrapText(c, text, x, y, maxW, lh){
  const lines = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const w of para.split(' ')) { const t = line ? line + ' ' + w : w; if (line && c.measureText(t).width > maxW) { lines.push(line); line = w; } else line = t; }
    lines.push(line);
  }
  const y0 = y - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => c.fillText(l, x, y0 + i * lh));
}
function panelBg(c, W, H, fill = 'rgba(15,28,38,0.9)', r = 36){ roundRect(c, 4, 4, W - 8, H - 8, r); c.fillStyle = fill; c.fill(); c.lineWidth = 6; c.strokeStyle = 'rgba(255,255,255,0.3)'; c.stroke(); }
class CanvasPlane {
  constructor(w, h, ppm = 400){
    this.canvas = document.createElement('canvas');
    this.canvas.width = Math.round(w * ppm); this.canvas.height = Math.round(h * ppm);
    this.ctx = this.canvas.getContext('2d');
    this.tex = new THREE.CanvasTexture(this.canvas); this.tex.colorSpace = THREE.SRGBColorSpace; this.tex.anisotropy = 4;
    this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: this.tex, transparent: true, fog: false }));
  }
  draw(fn){ const c = this.ctx; c.clearRect(0, 0, this.canvas.width, this.canvas.height); fn(c, this.canvas.width, this.canvas.height); this.tex.needsUpdate = true; return this; }
}

/* ---------- klõpsatavad objektid ---------- */
const clickables = new Set();
function makeClickable(obj, fn){ obj.userData.onClick = fn; obj.userData.baseScale = obj.scale.clone(); clickables.add(obj); }
function unclick(obj){ obj.traverse(o => clickables.delete(o)); }
function shown(o){ let last = null; while (o) { if (!o.visible) return false; last = o; o = o.parent; } return last === scene; }
function visibleClickables(){ return [...clickables].filter(shown); }
function makeButton(label, w, h, onClick, { color = '#2e7d32', emoji = null, fs = 0.36 } = {}){
  const p = new CanvasPlane(w, h, 400);
  p.draw((c, W, H) => {
    roundRect(c, 5, 5, W - 10, H - 10, Math.min(W, H) * 0.2); c.fillStyle = color; c.fill(); c.lineWidth = 8; c.strokeStyle = 'rgba(255,255,255,.85)'; c.stroke();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    if (emoji) { c.font = `${H * 0.36}px ${FONT}`; c.fillText(emoji, W / 2, H * 0.32); c.font = `bold ${H * 0.15}px ${FONT}`; wrapText(c, label, W / 2, H * 0.74, W * 0.9, H * 0.17); }
    else { c.font = `bold ${H * fs}px ${FONT}`; wrapText(c, label, W / 2, H / 2, W * 0.9, H * fs * 1.1); }
  });
  makeClickable(p.mesh, onClick);
  return p.mesh;
}
const SHARED = new Set();
function disposeTree(o){ o.traverse(x => { if (x.geometry && !SHARED.has(x.geometry)) x.geometry.dispose(); if (x.material && !SHARED.has(x.material)) { if (x.material.map) x.material.map.dispose(); x.material.dispose(); } }); }

const raycaster = new THREE.Raycaster(); raycaster.far = 30;

}

  for (const o of clickables) { const s = o.userData.baseScale; if (s && !o.userData.noHover) o.scale.copy(s).multiplyScalar(hs.has(o) ? 1.08 : 1); }
}
let leftGrip = null;
const controllers = [];

  const ctrl = renderer.xr.getController(i), grip = renderer.xr.getControllerGrip(i);

  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .7 }));
  line.scale.z = 5; ctrl.add(line);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffeb3b })); dot.visible = false; scene.add(dot);
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.03, 0.12), new THREE.MeshLambertMaterial({ color: 0x333333 })); body.position.z = 0.03; grip.add(body);
  const c = { ctrl, grip, line, dot, handedness: null, index: i };
  ctrl.addEventListener('connected', e => { c.handedness = e.data.handedness; if (c.handedness === 'left') { leftGrip = grip; placeMap(); } });
  ctrl.addEventListener('disconnected', () => { if (c.handedness === 'left') { leftGrip = null; placeMap(); } c.handedness = null; });
  ctrl.addEventListener('selectstart', () => { const h = rayFromCtrl(c); if (h) activate(h.object, h); });
  controllers.push(c);
}
function rayFromCtrl(c){
  tmpM.identity().extractRotation(c.ctrl.matrixWorld);
  _o.setFromMatrixPosition(c.ctrl.matrixWorld); _d.set(0, 0, -1).applyMatrix4(tmpM);
  raycaster.set(_o, _d);
  return raycaster.intersectObjects(visibleClickables(), false)[0] || null;
}
let tableHoverUV = null;
function updateRays(){
  let tableHit = null;
  for (const c of controllers) {
    if (!renderer.xr.isPresenting || !c.handedness) { c.line.visible = false; c.dot.visible = false; continue; }
    const h = rayFromCtrl(c);
    c.line.visible = !!h || state !== 'forest' || paused;
    c.line.scale.z = h ? h.distance : 5;

}
const mouse = new THREE.Vector2();
let dragging = false, dragMoved = 0, lastX = 0, lastY = 0, pitch = 0;
function mouseHit(e){ mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); raycaster.setFromCamera(mouse, camera); return raycaster.intersectObjects(visibleClickables(), false)[0] || null; }
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; dragMoved = 0; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointerup', e => { if (dragging && dragMoved < 6 && !renderer.xr.isPresenting) { const h = mouseHit(e); if (h) activate(h.object, h); } dragging = false; });
addEventListener('pointermove', e => {
  if (renderer.xr.isPresenting) return;
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY; dragMoved += Math.abs(dx) + Math.abs(dy);
    rig.rotation.y -= dx * 0.004; pitch = THREE.MathUtils.clamp(pitch - dy * 0.004, -1.2, 1.2); camera.rotation.x = pitch;
    lastX = e.clientX; lastY = e.clientY;
  } else { const h = mouseHit(e); setHover('mouse', h ? h.object : null); tableHoverUV = h && h.object === table.mesh ? h.uv : null; }
});
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyM') toggleMap(); if (e.code === 'Escape') menuButton(); });

const moveInput = new THREE.Vector2();

let snapReady = true, sprintXR = false;
function rotateRigAroundHead(a){ camera.getWorldPosition(head); rig.position.sub(head); rig.position.applyAxisAngle(UP, a); rig.position.add(head); rig.rotation.y += a; }
function updateXRInput(){
  const session = renderer.xr.getSession(); sprintXR = false; if (!session) return;
  for (const src of session.inputSources) {

    const ax = gp.axes, b = gp.buttons;
    const sx = ax.length >= 4 ? ax[2] : (ax[0] || 0), sy = ax.length >= 4 ? ax[3] : (ax[1] || 0);

    else if (src.handedness === 'right') {
      if (Math.abs(sx) > 0.7 && snapReady) { snapReady = false; rotateRigAroundHead(sx > 0 ? -Math.PI / 6 : Math.PI / 6); }
      else if (Math.abs(sx) < 0.3) snapReady = true;
    }

}

/* =========================================================

const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x4f8fd6) }, hor: { value: HORIZON.clone() }, sunDir: { value: SUN_DIR }, time: { value: 0 } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform float time; varying vec3 vD;
    float hs(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float ns(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(hs(i), hs(i + vec2(1.0, 0.0)), f.x), mix(hs(i + vec2(0.0, 1.0)), hs(i + vec2(1.0, 1.0)), f.x), f.y); }
    float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * ns(p); p *= 2.03; a *= 0.5; } return v; }
    void main(){
      vec3 d = normalize(vD); float h = clamp(d.y, 0.0, 1.0);
      vec3 c = mix(hor, top, pow(h, 0.55));
      float s = max(dot(d, sunDir), 0.0);
      if (d.y > 0.02) {
        vec2 uv = d.xz / (d.y + 0.12) * 1.4 + vec2(time * 0.004, time * 0.002);
        float cl = smoothstep(0.52, 0.78, fbm(uv));
        vec3 cc = mix(vec3(0.82, 0.85, 0.9), vec3(1.0), smoothstep(0.5, 0.9, fbm(uv * 1.7 + 3.0)));
        c = mix(c, cc, cl * 0.85 * smoothstep(0.02, 0.22, d.y));
      }
      c += vec3(1.0, 0.9, 0.7) * pow(s, 600.0) * 1.5 + vec3(1.0, 0.85, 0.6) * pow(s, 12.0) * 0.25;
      gl_FragColor = vec4(c, 1.0);
    }`
}));
skyMesh.renderOrder = -1; skyMesh.frustumCulled = false; skyMesh.visible = false; scene.add(skyMesh);

/* =========================================================
   KEHRA – OPENSTREETMAP
   ========================================================= */
const HALF_W = 1650, HALF_H = 1860, MW = HALF_W * 2, MD = HALF_H * 2;   // ~3,3 × 3,7 km
let LAT0 = 59.3355, LON0 = 25.336, KX = 111320 * Math.cos(LAT0 * Math.PI / 180);
const KZ = 110540;
const ll2w = (lat, lon) => [(lon - LON0) * KX, -(lat - LAT0) * KZ];
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
async function overpass(q){
  let err;
  for (const u of OVERPASS) {
    try {
      const r = await fetch(u, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
      if (r.ok) return await r.json();
      err = new Error('HTTP ' + r.status);
    } catch (e) { err = e; }
  }
  throw err;
}
async function loadOSM(){
  try { const r = await fetch('kehra_osm.json'); if (r.ok) { setLoad('Laen faili kehra_osm.json…'); const d = await r.json(); if (d.elements) {
      if (!d.center) {
        const k = d.elements.find(e => e.type === 'node' && e.tags && e.tags.name === 'Kehra' && e.tags.place);
        if (k) d.center = { lat: k.lat, lon: k.lon };
        else { let la = 0, lo = 0, n = 0; for (const e of d.elements) if (e.type === 'node' && e.lat) { la += e.lat; lo += e.lon; n++; } d.center = n ? { lat: la / n, lon: lo / n } : { lat: LAT0, lon: LON0 }; }
      }
      return { data: d, fromFile: true };
    } } } catch (e) {}
  setLoad('Laen OpenStreetMapist Kehra andmeid… (10–60 s)');
  let lat = LAT0, lon = LON0;
  try {
    const p = await overpass('[out:json][timeout:25];node["name"="Kehra"]["place"~"town|village"];out 1;');
    if (p.elements && p.elements.length) { lat = p.elements[0].lat; lon = p.elements[0].lon; }
  } catch (e) {}
  const dLat = HALF_H / KZ, dLon = HALF_W / (111320 * Math.cos(lat * Math.PI / 180));
  const bb = `${(lat - dLat).toFixed(6)},${(lon - dLon).toFixed(6)},${(lat + dLat).toFixed(6)},${(lon + dLon).toFixed(6)}`;
  const q = `[out:json][timeout:120][bbox:${bb}];(way["building"];way["highway"];way["railway"];way["waterway"];way["natural"];relation["natural"];way["landuse"];relation["landuse"];way["leisure"];way["amenity"];way["barrier"~"fence|wall"];node["place"];node["railway"="station"];node["natural"="tree"];);out geom;`;
  const data = await overpass(q);
  data.center = { lat, lon };
  return { data, fromFile: false };
}

// --- töötlus ---
const near = (p, q) => Math.abs(p[0] - q[0]) < 0.05 && Math.abs(p[1] - q[1]) < 0.05;
function stitch(segs){
  const rings = [], pool = segs.filter(s => s.length > 1).map(s => s.slice());
  while (pool.length) {
    let ring = pool.shift(), guard = 0;
    while (guard++ < 5000) {
      const a = ring[0], b = ring[ring.length - 1];
      if (ring.length > 3 && near(a, b)) break;
      let found = false;
      for (let i = 0; i < pool.length; i++) {
        const s = pool[i], s0 = s[0], s1 = s[s.length - 1];
        if (near(b, s0)) ring = ring.concat(s.slice(1));
        else if (near(b, s1)) ring = ring.concat(s.slice(0, -1).reverse());
        else if (near(a, s1)) ring = s.slice(0, -1).concat(ring);
        else if (near(a, s0)) ring = s.slice(1).reverse().concat(ring);
        else continue;
        pool.splice(i, 1); found = true; break;
      }
      if (!found) break;
    }
    rings.push(ring);
  }
  return rings;
}
const polyArea = r => { let a = 0; for (let i = 0, j = r.length - 1; i < r.length; j = i++) a += (r[j][0] + r[i][0]) * (r[j][1] - r[i][1]); return Math.abs(a / 2); };
const centroid = r => { let x = 0, z = 0; for (const p of r) { x += p[0]; z += p[1]; } return [x / r.length, z / r.length]; };
function areaKind(t){
  const lu = t.landuse, na = t.natural, le = t.leisure;
  if (na === 'water' || t.waterway === 'riverbank' || lu === 'reservoir' || lu === 'basin') return 'water';
  if (lu === 'forest' || na === 'wood') return 'forest';
  if (na === 'scrub') return 'scrub';
  if (na === 'wetland') return 'wetland';
  if (lu === 'farmland') return 'farmland';
  if (['meadow', 'grass', 'village_green', 'recreation_ground', 'greenfield'].includes(lu) || ['grassland', 'heath'].includes(na) || ['park', 'garden', 'stadium', 'sports_centre', 'playground'].includes(le)) return 'grass';
  if (lu === 'residential') return 'residential';
  if (['industrial', 'commercial', 'retail', 'railway', 'construction', 'brownfield', 'landfill', 'quarry', 'garages'].includes(lu)) return 'industrial';
  if (['allotments', 'orchard', 'plant_nursery', 'farmyard'].includes(lu)) return 'allotments';
  if (lu === 'cemetery') return 'cemetery';
  if (le === 'pitch') return 'pitch';
  if (le === 'track') return 'track';
  if (t.amenity === 'parking') return 'parking';
  if (na === 'sand' || na === 'bare_rock') return 'sand';
  return null;
}
const F = { areas: [], roads: [], rails: [], waterways: [], buildings: [], fences: [], places: [], trees: [] };
function classify(t, rings, closed, id){
  const main = rings[0]; if (!main || main.length < 2) return;
  if (t.name && (t.leisure === 'stadium' || t.amenity === 'school' || t.amenity === 'place_of_worship' || t.landuse === 'industrial' || t.leisure === 'park')) {
    const [x, z] = centroid(main); F.places.push({ name: t.name, x, z, kind: 'landmark' });
  }

let course = [], startPt = { x: 0, z: 0 }, nextKP = 0, elapsed = 0, finished = true, mapTimer = 0, paused = false;
const sel = { cx: 0, cz: 0, size: 700, full: false, diff: 'kerge', name: 'Kesklinn' };
function selRect(){
  if (sel.full) return { x0: -HALF_W, z0: -HALF_H, x1: HALF_W, z1: HALF_H };
  const h = sel.size / 2, cx = THREE.MathUtils.clamp(sel.cx, -HALF_W + h, HALF_W - h), cz = THREE.MathUtils.clamp(sel.cz, -HALF_H + h, HALF_H - h);
  return { x0: cx - h, z0: cz - h, x1: cx + h, z1: cz + h };
}
function validPt(x, z){ return !isWater(x, z) && !inBuilding(x, z, 2) && Math.abs(x) < HALF_W - 5 && Math.abs(z) < HALF_H - 5; }
function genCourse(r, n){
  const S = Math.min(r.x1 - r.x0, r.z1 - r.z0), m = S * 0.05, cx = (r.x0 + r.x1) / 2, cz = (r.z0 + r.z1) / 2;
  let start = { x: cx, z: cz };
  outer: for (let rad = 0; rad < S / 2; rad += 4) for (let k = 0; k < 16; k++) { const x = cx + Math.cos(k * 0.39) * rad, z = cz + Math.sin(k * 0.39) * rad; if (validPt(x, z)) { start = { x, z }; break outer; } }
  const minLeg = S * (sel.full ? 0.08 : 0.13), maxLeg = S * (sel.full ? 0.25 : 0.45);
  let best = [];
  for (let attempt = 0; attempt < 80; attempt++) {
    const pts = []; let tries = 0;
    while (pts.length < n && tries++ < 3000) {
      const x = THREE.MathUtils.lerp(r.x0 + m, r.x1 - m, rand()), z = THREE.MathUtils.lerp(r.z0 + m, r.z1 - m, rand());
      if (!validPt(x, z)) continue;
      const prev = pts.length ? pts[pts.length - 1] : start, leg = Math.hypot(x - prev.x, z - prev.z);
      if (leg < minLeg || leg > maxLeg) continue;
      if (pts.some(p => Math.hypot(p.x - x, p.z - z) < minLeg * 0.8) || Math.hypot(x - start.x, z - start.z) < minLeg * 0.6) continue;
      pts.push({ x, z });
    }
    if (pts.length > best.length) best = pts;
    if (best.length === n) break;
  }
  return { start, pts: best };
}

  rig.rotation.set(0, ry, 0);
  const off = renderer.xr.isPresenting ? new THREE.Vector3(camera.position.x, 0, camera.position.z).applyAxisAngle(UP, ry) : new THREE.Vector3();
  rig.position.set(x - off.x, 0, z - off.z);
}
function toMeadow(ui){ closePause(); game = null; finished = true; clearGameObjects(); setEnv('meadow'); showUI(ui); placePlayer(0, 0, 0); mapHolder.visible = false; }
function goMenu(){ state = 'menu'; toMeadow('menu'); }
function showHub(){ state = 'learn'; toMeadow('hub'); }
function showSelect(){ state = 'select'; toMeadow('select'); drawTable(); drawSelInfo(); }
function startKehra(){
  if (!kehraReady) { notify('Kaart alles laeb…'); return; }
  closePause();
  state = 'forest'; game = null; clearGameObjects(); setEnv('kehra'); showUI('none');
  const r = selRect(), res = genCourse(r, sel.diff === 'kerge' ? 5 : 8);
  startPt = res.start; course = res.pts;
  for (const ch of [...kpGroup.children]) { kpGroup.remove(ch); disposeTree(ch); }
  course.forEach((p, i) => { const k = makeKP(i + 1); k.position.set(p.x, heightAt(p.x, p.z), p.z); kpGroup.add(k); });
  gate.position.set(startPt.x, heightAt(startPt.x, startPt.z - 3), startPt.z - 3);
  buildMap(r);
  restartCourse();
}
function restartCourse(){
  nextKP = 0; elapsed = 0; finished = false; mapMode = 0; placeMap(); mapTimer = 1;
  course.forEach(p => { delete p.split; });
  showUI('none'); placePlayer(startPt.x, startPt.z, 0);
  updateChunks(true); updateGrass(true);
  notify('Start! Vaata kaarti ja otsi KP 1', 4);
}
function finishRun(){
  finished = true; sfx.win();
  forestResPanel.draw((c, W, H) => {
    panelBg(c, W, H); c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#ffd54f'; c.font = `bold ${H * 0.11}px ${FONT}`; c.fillText('🏁 Finiš!', W / 2, H * 0.1);
    c.fillStyle = '#fff'; c.font = `bold ${H * 0.075}px ${FONT}`;
    c.fillText(`${sel.full ? 'Kogu kaart' : sel.name} • ${sel.diff} • aeg ${fmtTime(elapsed)}`, W / 2, H * 0.22);
    c.font = `${H * 0.055}px ${FONT}`; c.fillStyle = '#cfd8dc';
    let prev = 0;
    course.forEach((p, i) => { c.fillText(`KP ${i + 1}: ${fmtTime(p.split)}  (+${fmtTime(p.split - prev)})`, W / 2, H * 0.34 + i * H * 0.07); prev = p.split; });
  });
  showUI('forestRes'); mapHolder.visible = false;
  camera.getWorldPosition(head); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  forestResUI.position.copy(head).addScaledVector(fwd, 1.8); forestResUI.position.y = head.y - 0.1;
  forestResUI.lookAt(head.x, forestResUI.position.y, head.z);
}

function updateForest(dt){
  if (paused) { mapHolder.visible = false; return; }
  if (!renderer.xr.isPresenting) {
    if (keys.KeyW || keys.ArrowUp) moveInput.y -= 1; if (keys.KeyS || keys.ArrowDown) moveInput.y += 1;
    if (keys.KeyA) moveInput.x -= 1; if (keys.KeyD) moveInput.x += 1;
    if (keys.ArrowLeft) rig.rotation.y += 1.8 * dt; if (keys.ArrowRight) rig.rotation.y -= 1.8 * dt;
  }
  const mx = moveInput.x, my = moveInput.y, len = Math.hypot(mx, my);
  const inWater = isWater(rig.position.x, rig.position.z);
  if (!finished && len > 0.15) {
    camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    const fv = forestAt(rig.position.x, rig.position.z);
    let speed = inWater ? 0.9 : fv > 100 ? 2.4 : fv > 30 ? 2.0 : 3.4;
    if (keys.ShiftLeft || sprintXR) speed *= 1.9;
    speed *= Math.min(1, len);
    const dx = (fwd.x * -my + -fwd.z * mx) / len * speed * dt, dz = (fwd.z * -my + fwd.x * mx) / len * speed * dt;
    const px = rig.position.x, pz = rig.position.z, lim = (v, L) => Math.abs(v) < L - 3;
    const ok = (x, z) => lim(x, HALF_W) && lim(z, HALF_H) && !inBuilding(x, z);
    if (ok(px + dx, pz + dz)) { rig.position.x += dx; rig.position.z += dz; }
    else if (ok(px + dx, pz)) rig.position.x += dx;
    else if (ok(px, pz + dz)) rig.position.z += dz;
    else if (!lim(px + dx, HALF_W) || !lim(pz + dz, HALF_H)) notify('Kaardi serv – pööra tagasi');
    if (!inWater && isWater(rig.position.x, rig.position.z)) notify('Vesi! Ujudes läheb aeglaselt – otsi sild');
  }
  const by = bridgeY(rig.position.x, rig.position.z), gy = by !== null ? by : heightAt(rig.position.x, rig.position.z);
  rig.position.y = THREE.MathUtils.lerp(rig.position.y, gy, Math.min(1, dt * 8));

  if (!finished) {
    elapsed += dt; camera.getWorldPosition(head);
    if (nextKP < course.length) {
      const kp = course[nextKP];
      if (Math.hypot(head.x - kp.x, head.z - kp.z) < 4) {
        sfx.punch(); kp.split = elapsed; nextKP++;
        notify(nextKP < course.length ? `KP ${nextKP} ✓  Nüüd otsi KP ${nextKP + 1}` : `KP ${nextKP} ✓  Nüüd finišisse!`, 3);
      } else for (let i = nextKP + 1; i < course.length; i++)
        if (Math.hypot(head.x - course[i].x, head.z - course[i].z) < 4) notify(`See on KP ${i + 1}. Võta enne KP ${nextKP + 1}!`);
    } else if (Math.hypot(head.x - startPt.x, head.z - startPt.z) < 5) finishRun();
  }
  mapHolder.visible = mapMode !== 2 && !finished;
  mapTimer += dt;
  if (mapHolder.visible && mapTimer > 0.2) { mapTimer = 0; updateMapPanel(); }
  chunkTimer += dt; if (chunkTimer > 0.4) { chunkTimer = 0; updateChunks(); updateGrass(false); }
}

/* ---------- XR sessioon ---------- */
const info = document.getElementById('info');
renderer.xr.addEventListener('sessionstart', () => { camera.rotation.set(0, 0, 0); pitch = 0; info.style.display = 'none'; setTimeout(() => { if (state !== 'forest') placePlayer(0, 0, 0); }, 300); });
renderer.xr.addEventListener('sessionend', () => { leftGrip = null; placeMap(); info.style.display = ''; camera.position.set(0, 1.6, 0); });

/* ---------- põhitsükkel ---------- */
const clock = new THREE.Clock();
placeMap(); goMenu();
let tableTimer = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  moveInput.set(0, 0);
  updateXRInput();
  if (state === 'forest') updateForest(dt); else { mapHolder.visible = false; rig.position.y = 0; }
  if (!paused) updateAnswers(dt, t);
  if (noticeT > 0) { noticeT -= dt; if (noticeT <= 0) notice.mesh.visible = false; }
  if (skyMesh.visible) { camera.getWorldPosition(head); skyMesh.position.copy(head); skyMesh.material.uniforms.time.value = t; }
  if (waterMat && kehra.visible) { waterNormal.offset.x = t * 0.02; waterNormal.offset.y = t * 0.013; }
  updateRays();
  if (state === 'select') {
    tableTimer += dt;
    const key = tableHoverUV ? `${Math.round(tableHoverUV.x * 200)},${Math.round(tableHoverUV.y * 200)}` : '';
    if (key !== lastHoverKey && tableTimer > 0.08) { lastHoverKey = key; tableTimer = 0; drawTable(); }
  }
  renderer.render(scene, camera);
});
</script>
